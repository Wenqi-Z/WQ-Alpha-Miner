[project]
name = "wq-alpha-mining"
version = "0.1.0"
description = "Automated alpha-discovery pipeline for WorldQuant Brain."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.5.3",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "langsmith>=0.9.5",
    "pandas>=2.0",
    "pyarrow>=14",
    "python-dotenv>=1.0",
    "pyyaml>=6.0.3",
    "requests>=2.31",
    "scikit-learn>=1.7.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pytest>=9.1.1",
]

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # formatter owns line length; E501 fights docstring examples

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Vendored GP engine: format + import-sort only, no semantic/lint churn
"wq_alpha_miner/gp_miner/*" = ["E", "F", "W", "UP", "B", "I002"]
